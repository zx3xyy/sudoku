<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121213" />
  <meta name="description" content="Sudoku — with notes, trial mode, and hints. Play on any phone." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sudoku" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='4' y='4' width='92' height='92' rx='10' fill='%23121213'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='3'%3E%3Cpath d='M4 36h92M4 68h92M36 4v92M68 4v92'/%3E%3C/g%3E%3Ctext x='20' y='30' font-size='22' fill='%236aaa64' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3E5%3C/text%3E%3Ctext x='52' y='62' font-size='22' fill='%23c9b458' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3E3%3C/text%3E%3Ctext x='82' y='90' font-size='22' fill='%23538d4e' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3E7%3C/text%3E%3C/svg%3E" />
  <title>Sudoku</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="header-side">
        <button id="btn-new" class="text-btn">New</button>
      </div>
      <h1>Sudoku</h1>
      <div class="header-side right">
        <button id="btn-stats" class="icon-btn" aria-label="Statistics and help">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </button>
        <button id="btn-theme" class="icon-btn" aria-label="Toggle light and dark mode">
          <svg id="icon-moon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="icon-sun" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </header>

    <div id="statusbar">
      <span id="difficulty-label">Easy</span>
      <span id="mistakes">Mistakes: 0</span>
      <span id="timer">0:00</span>
      <button id="btn-pause" class="icon-btn" aria-label="Pause">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="5" x2="9" y2="19"/><line x1="15" y1="5" x2="15" y2="19"/></svg>
      </button>
    </div>

    <main>
      <div id="toast-container" aria-live="polite"></div>
      <div id="board-wrap">
        <div id="board" role="grid" aria-label="Sudoku board"></div>
        <div id="paused-veil" class="hidden">Paused</div>
      </div>

      <div id="controls">
        <button id="btn-undo" class="tool" aria-label="Undo">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
          <span>Undo</span>
        </button>
        <button id="btn-erase" class="tool" aria-label="Erase">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8L3 15a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l5.2 5.2a2 2 0 0 1 0 2.8L13 18"/></svg>
          <span>Erase</span>
        </button>
        <button id="btn-notes" class="tool" aria-label="Toggle notes mode" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          <span>Notes</span>
        </button>
        <button id="btn-trial" class="tool" aria-label="Toggle trial mode" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span>Trial</span>
        </button>
        <button id="btn-hint" class="tool" aria-label="Hint">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
          <span>Hint</span>
        </button>
      </div>

      <button id="btn-clear-trial" class="hidden">Erase all trial entries</button>

      <div id="pad" aria-label="Number pad"></div>
    </main>

    <div id="modal-overlay" class="hidden">
      <div id="modal" role="dialog" aria-modal="true">
        <button id="modal-close" class="icon-btn" aria-label="Close">&times;</button>
        <div id="modal-content"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
